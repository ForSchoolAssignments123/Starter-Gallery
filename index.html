<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Musical Instruments Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    .gallery { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    figure { margin: 0; }
    img { height: 250px; width: auto; border-radius: 6px; }
    figcaption { font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>Musical Instruments</h1>

  <div class="gallery">
    <figure>
      <img src="images/drums.jpg" alt="Drums">
    </figure>

    <figure>
      <img src="images/violin.jpg" alt="Violin">
    </figure>

    <figure>
      <img src="images/Piano.jpg" alt="Piano">
      <figcaption>
        “Piano” by Molly DG, licensed under
        <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">
          CC BY 2.0
        </a>
      </figcaption>
    </figure>
  </div>

</body>
</html>
